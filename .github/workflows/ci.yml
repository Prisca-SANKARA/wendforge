# ─────────────────────────────────────────────
# WendForge — CI/CD GitHub Actions
# Lancé automatiquement à chaque push sur main
# et à chaque Pull Request
#
# Pipeline :
# 1. Checkout du code
# 2. Installation Python + dépendances
# 3. Lint avec flake8 (qualité du code)
# 4. Tests pytest avec SQLite en mémoire
# 5. Build Docker (vérifie que l'image se construit)
# ─────────────────────────────────────────────

name: WendForge CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1 : Tests ─────────────────────────
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip pour accélérer les builds suivants
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Installation des dépendances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint avec flake8
        working-directory: backend
        run: |
          pip install flake8
          # Vérifie les erreurs critiques uniquement
          # E9xx : erreurs de syntaxe
          # F63x : erreurs de logique
          # F7xx : erreurs de syntaxe avancées
          # F82x : variables non définies
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avertissements non bloquants (complexité, longueur)
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Tests pytest
        working-directory: backend
        env:
          # Variables d'environnement pour les tests
          # SQLite est utilisé en mémoire — pas besoin de PostgreSQL
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: wendforge
          KEYCLOAK_CLIENT_ID: wendforge-api
          KEYCLOAK_CLIENT_SECRET: test-secret
          CLAUDE_API_KEY: test-api-key
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-min-32-chars-long
        run: |
          pytest app/tests/ -v --tb=short --no-header

  # ── Job 2 : Build Docker ──────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test  # Lance seulement si les tests passent

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build image Docker
        working-directory: backend
        run: |
          docker build -t wendforge-api:test .

      - name: Vérifie que l'image démarre
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:///./test.db \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e KEYCLOAK_URL=http://localhost:8080 \
            -e KEYCLOAK_REALM=wendforge \
            -e KEYCLOAK_CLIENT_ID=wendforge-api \
            -e KEYCLOAK_CLIENT_SECRET=test-secret \
            -e CLAUDE_API_KEY=test-key \
            -e ENVIRONMENT=test \
            -e SECRET_KEY=test-secret-key-min-32-chars-long \
            wendforge-api:test \
            python -c "from app.main import app; print('Import OK')"